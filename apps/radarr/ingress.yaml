apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: media

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - radarr.apps.bubudog.net
      secretName: radarr-tls

  rules:
    - host: radarr.apps.bubudog.net

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: radarr

                port:
                  number: 7878