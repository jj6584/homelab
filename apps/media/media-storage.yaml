apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-library

spec:
  capacity:
    storage: 2Ti

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  mountOptions:
    - nfsvers=4.1

  nfs:
    server: 172.16.0.2
    path: /mnt/main/media

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media

spec:
  accessModes:
    - ReadWriteMany

  storageClassName: ""

  volumeName: media-library

  resources:
    requests:
      storage: 2Ti