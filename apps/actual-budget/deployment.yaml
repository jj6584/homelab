apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: finance

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: actual-budget

  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-budget

    spec:
      containers:
        - name: actual-budget

          image: actualbudget/actual-server:26.8.1

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5006
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
