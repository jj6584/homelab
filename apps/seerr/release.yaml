
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: seerr
  namespace: flux-system

spec:
  interval: 30m

  releaseName: seerr
  targetNamespace: media

  chartRef:
    kind: OCIRepository
    name: seerr
    namespace: flux-system

  install:
    createNamespace: false

    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true

    remediation:
      retries: 3

  values:
    config:
      persistence:
        storageClass: truenas-nfs
        accessModes:
          - ReadWriteOnce
        size: 5Gi

    extraEnv:
      - name: TZ
        value: Asia/Manila

    ingress:
      enabled: true

      ingressClassName: traefik

      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod

      hosts:
        - host: seerr.apps.bubudog.net
          paths:
            - path: /
              pathType: Prefix

      tls:
        - secretName: seerr-tls
          hosts:
            - seerr.apps.bubudog.net

    resources:
      requests:
        cpu: 50m
        memory: 128Mi

      limits:
        cpu: 500m
        memory: 512Mi