apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr

  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr

    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          imagePullPolicy: IfNotPresent

          env:
            - name: LOG_LEVEL
              value: info

            - name: TZ
              value: Asia/Manila

            - name: CAPTCHA_SOLVER
              value: none

          ports:
            - name: http
              containerPort: 8191
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 1Gi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3