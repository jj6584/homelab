apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
  namespace: flux-system
spec:
  interval: 30m

  releaseName: nfs-provisioner
  targetNamespace: nfs-provisioner

  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.0.18"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    nfs:
      server: 172.16.0.2
      path: /mnt/homelab/kubernetes

    storageClass:
      create: true
      name: truenas-nfs
      defaultClass: false
      reclaimPolicy: Retain
      archiveOnDelete: true