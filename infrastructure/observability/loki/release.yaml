apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: loki
  namespace: flux-system

spec:
  interval: 30m

  releaseName: loki
  targetNamespace: observability

  chart:
    spec:
      chart: loki
      version: "18.3.0"

      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system

      interval: 1h

  install:
    createNamespace: false

    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true

    remediation:
      retries: 3

  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false

      commonConfig:
        path_prefix: /var/loki
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13

            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: filesystem

      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

      limits_config:
        retention_period: 168h
        allow_structured_metadata: true
        volume_enabled: true

    singleBinary:
      replicas: 1

      persistence:
        enabled: true
        storageClass: truenas-nfs

        accessModes:
          - ReadWriteOnce

        size: 10Gi

      resources:
        requests:
          cpu: 100m
          memory: 256Mi

        limits:
          cpu: 500m
          memory: 768Mi

    gateway:
      enabled: true

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    test:
      enabled: false

    lokiCanary:
      enabled: false

    minio:
      enabled: false

    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0

    ingester:
      replicas: 0

    querier:
      replicas: 0

    queryFrontend:
      replicas: 0

    queryScheduler:
      replicas: 0

    distributor:
      replicas: 0

    compactor:
      replicas: 0

    indexGateway:
      replicas: 0

    bloomPlanner:
      replicas: 0

    bloomBuilder:
      replicas: 0

    bloomGateway:
      replicas: 0