apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: alloy
  namespace: flux-system

spec:
  interval: 30m

  releaseName: alloy
  targetNamespace: observability

  chart:
    spec:
      chart: alloy
      version: "1.11.0"

      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

      interval: 1h

  install:
    createNamespace: false

    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true

    remediation:
      retries: 3

  values:
    controller:
      type: daemonset

    alloy:
      enableReporting: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi

        limits:
          cpu: 300m
          memory: 256Mi

      configMap:
        content: |-
          logging {
            level  = "info"
            format = "logfmt"
          }

          discovery.kubernetes "media_pods" {
            role = "pod"

            namespaces {
              names = ["media"]
            }

            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "media_pods" {
            targets = discovery.kubernetes.media_pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              target_label = "cluster"
              replacement  = "homelab"
            }
          }

          loki.source.kubernetes "media_pods" {
            targets    = discovery.relabel.media_pods.output
            forward_to = [loki.write.loki.receiver]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
            }
          }