apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: alloy
  namespace: flux-system

spec:
  interval: 30m

  releaseName: alloy
  targetNamespace: observability

  chart:
    spec:
      chart: alloy
      version: "1.11.0"

      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

      interval: 1h

  install:
    createNamespace: false

    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true

    remediation:
      retries: 3

  values:
    controller:
      type: daemonset

      # Collect from every node, including control-plane and future tainted nodes.
      tolerations:
        - operator: Exists

    rbac:
      create: true
      namespaces: []

    serviceMonitor:
      enabled: true

    alloy:
      enableReporting: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi

        limits:
          cpu: 300m
          memory: 256Mi

      configMap:
        content: |-
          logging {
            level  = "info"
            format = "logfmt"
          }

          discovery.kubernetes "pods" {
            role = "pod"

            // The Helm chart sets HOSTNAME to spec.nodeName. Each agent tails
            // only its own node so streams are not duplicated across agents.
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            // Prefer the standard app label, then the legacy app label, then
            // the container name so unlabeled workloads remain identifiable.
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              regex         = "(.+)"
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "(.+)"
              target_label  = "app"
            }

            rule {
              target_label = "cluster"
              replacement  = "homelab"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.loki.receiver]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
            }
          }
