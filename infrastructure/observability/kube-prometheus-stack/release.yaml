apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m

  releaseName: kube-prometheus-stack
  targetNamespace: observability

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    grafana:
      enabled: true

      ingress:
        enabled: false

      persistence:
        enabled: false

      defaultDashboardsTimezone: browser

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

    prometheus:
      prometheusSpec:
        replicas: 1

        scrapeInterval: 30s
        evaluationInterval: 30s

        retention: 7d

        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi

    alertmanager:
      enabled: true

      alertmanagerSpec:
        replicas: 1

    kubeEtcd:
      enabled: false

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false