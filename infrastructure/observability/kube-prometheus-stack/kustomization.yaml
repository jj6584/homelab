apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - repository.yaml
  - release.yaml
  - ingress.yaml

configMapGenerator:
  - name: kube-prometheus-stack-flux-values
    namespace: flux-system

    files:
      - values.yaml=values/flux.yaml

generatorOptions:
  disableNameSuffixHash: true

  labels:
    reconcile.fluxcd.io/watch: Enabled