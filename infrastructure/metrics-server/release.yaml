apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: metrics-server
  namespace: flux-system

spec:
  interval: 30m

  releaseName: metrics-server
  targetNamespace: kube-system

  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"

      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system

      interval: 1h

  install:
    createNamespace: false

    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true

    remediation:
      retries: 3