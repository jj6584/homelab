apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m

  releaseName: traefik
  targetNamespace: traefik

  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    deployment:
      replicas: 2

    service:
      spec:
        type: LoadBalancer
        loadBalancerIP: 172.16.20.50

    ports:
      web:
        port: 8000
        exposedPort: 80

      websecure:
        port: 8443
        exposedPort: 443

    providers:
      kubernetesIngress:
        enabled: true

      kubernetesCRD:
        enabled: true

    ingressClass:
      enabled: true
      isDefaultClass: true

    ingressRoute:
      dashboard:
        enabled: false

    log:
      level: INFO