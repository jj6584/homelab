apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/storage/nfs
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: traefik

  wait: true
  timeout: 5m