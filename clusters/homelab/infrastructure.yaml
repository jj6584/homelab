apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/cert-manager
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: secrets

  wait: true
  timeout: 5m